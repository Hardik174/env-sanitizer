<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Env Sanitizer — Generate .env.example</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, textarea, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
          🔒
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            Env Sanitizer
            <span class="text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium">100% Client-Side</span>
          </h1>
          <p class="text-xs text-slate-400">Convert active <code class="text-slate-300">.env</code> files to clean, documented <code class="text-slate-300">.env.example</code> templates</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="loadSampleBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 transition text-slate-300">
          Load Sample
        </button>
        <button id="clearBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-rose-900/30 hover:border-rose-700 hover:text-rose-300 transition text-slate-400">
          Clear
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

    <!-- Privacy Banner -->
    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 px-4 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>All processing happens directly in your browser JavaScript memory. No data is sent over the network.</span>
      </div>
      <div id="statsBadge" class="font-mono text-slate-400 hidden sm:block">0 keys sanitized</div>
    </div>

    <!-- Dual Panes -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1">
      
      <!-- Input Panel -->
      <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
        <div class="p-3 px-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
          <span class="font-medium text-xs tracking-wider uppercase text-slate-400">Input: .env</span>
          <label class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span>Upload File</span>
            <input type="file" id="fileInput" class="hidden" accept=".env,text/*" />
          </label>
        </div>
        
        <div class="relative flex-1">
          <textarea
            id="inputEnv"
            placeholder="# Paste your raw .env file content here or drag and drop a file..."
            class="w-full h-full min-h-[350px] lg:min-h-[480px] p-4 bg-transparent text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500/50 resize-none"
            spellcheck="false"
          ></textarea>
        </div>
      </div>

      <!-- Output Panel -->
      <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
        <div class="p-3 px-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
          <span class="font-medium text-xs tracking-wider uppercase text-emerald-400">Output: .env.example</span>
          <div class="flex items-center gap-2">
            <button id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
              <span id="copyBtnText">Copy</span>
            </button>
            <button id="downloadBtn" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1 rounded border border-emerald-500 transition flex items-center gap-1.5 shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Download</span>
            </button>
          </div>
        </div>
        
        <div class="relative flex-1">
          <textarea
            id="outputEnv"
            readonly
            placeholder="# Sanitized template will appear here automatically..."
            class="w-full h-full min-h-[350px] lg:min-h-[480px] p-4 bg-slate-950/60 text-sm text-emerald-300 placeholder-slate-600 focus:outline-none resize-none"
            spellcheck="false"
          ></textarea>
        </div>
      </div>

    </div>
  </main>

  <script>
    const SAMPLE_ENV = `# Application Configuration
NODE_ENV=production
PORT=8080
DEBUG=false
APP_BASE_URL=https://myapp.company.internal

# Database Configuration
DATABASE_URL=postgres://admin:SuperSecretPass987@db.prod.internal:5432/main_db
REDIS_URL=redis://:AuthToken654@cache.prod.internal:6379/0

# Authentication & Security
JWT_SECRET=c2e88a6d45e12e9b08f43058849b
SESSION_KEY=94bc9bfd5d71c82ec4f940b9
ENCRYPTION_SALT=salt_89217398127391827

# Third Party Providers
AWS_ACCESS_KEY_ID=AKIA549EXAMPLEKEYID
AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
AWS_REGION=us-east-1
S3_BUCKET=my-production-media-assets

STRIPE_SECRET_KEY=sk_live_51M087EXAMPLESECRETKEY9812
STRIPE_WEBHOOK_SECRET=whsec_abc1234567890def

# Mail Settings
MAIL_HOST=smtp.sendgrid.net
MAIL_PORT=587
MAIL_USER=apikey
MAIL_PASSWORD=SG.v9081237091238.very_secret_token
MAIL_FROM=support@myapp.com`;

    const patterns = [
      { regex: /.*(DATABASE|DB)_URL.*/i, val: "postgresql://user:password@localhost:5432/dbname" },
      { regex: /.*REDIS_URL.*/i, val: "redis://localhost:6379/0" },
      { regex: /.*(BASE_URL|API_URL|ENDPOINT).*/i, val: "https://api.example.com/v1" },
      { regex: /.*WEBHOOK.*/i, val: "https://example.com/api/webhooks" },
      { regex: /.*URL.*/i, val: "https://example.com" },
      { regex: /.*PORT.*/i, val: "3000" },
      { regex: /.*HOST.*/i, val: "localhost" },
      { regex: /.*DB_NAME.*/i, val: "my_app_db" },
      { regex: /.*(DB_USER|DATABASE_USER).*/i, val: "db_user" },
      { regex: /.*(DB_PASS|DATABASE_PASS|DB_PASSWORD).*/i, val: "your_db_password_here" },
      { regex: /.*(JWT_SECRET|AUTH_SECRET).*/i, val: "your_jwt_secret_key_here" },
      { regex: /.*SECRET.*/i, val: "your_secret_key_here" },
      { regex: /.*(PRIVATE_KEY|PUBLIC_KEY).*/i, val: "your_pem_key_string_here" },
      { regex: /.*SALT.*/i, val: "your_encryption_salt_here" },
      { regex: /.*(ACCESS_TOKEN|REFRESH_TOKEN|BEARER).*/i, val: "your_bearer_token_here" },
      { regex: /.*API_KEY.*/i, val: "your_api_key_here" },
      { regex: /.*TOKEN.*/i, val: "your_token_here" },
      { regex: /.*KEY.*/i, val: "your_key_here" },
      { regex: /.*(PASSWORD|PASSWD|PASS).*/i, val: "your_strong_password_here" },
      { regex: /.*(USER|USERNAME).*/i, val: "your_username" },
      { regex: /.*(EMAIL|MAIL_FROM).*/i, val: "user@example.com" },
      { regex: /.*AWS_ACCESS_KEY_ID.*/i, val: "AKIAIOSFODNN7EXAMPLE" },
      { regex: /.*AWS_SECRET_ACCESS_KEY.*/i, val: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" },
      { regex: /.*AWS_REGION.*/i, val: "us-east-1" },
      { regex: /.*S3_BUCKET.*/i, val: "my-app-storage-bucket" },
      { regex: /.*STRIPE_PUBLISHABLE.*/i, val: "pk_test_51Abc..." },
      { regex: /.*STRIPE_SECRET.*/i, val: "sk_test_51Abc..." },
      { regex: /.*(ENV|ENVIRONMENT).*/i, val: "development" },
      { regex: /.*DEBUG.*/i, val: "true" },
      { regex: /.*TIMEOUT.*/i, val: "30" }
    ];

    function inferPlaceholder(key) {
      const cleanKey = key.trim().toUpperCase();
      for (const rule of patterns) {
        if (rule.regex.test(cleanKey)) {
          return rule.val;
        }
      }
      return `your_${cleanKey.toLowerCase()}_here`;
    }

    function sanitize(content) {
      let sanitizedCount = 0;
      const lines = content.split(/\r?\n/);
      const result = lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) return line;

        if (line.includes('=')) {
          const idx = line.indexOf('=');
          let key = line.substring(0, idx).trim();
          let prefix = "";
          if (key.startsWith('export ')) {
            prefix = "export ";
            key = key.replace(/^export\s+/, '').trim();
          }
          sanitizedCount++;
          return `${prefix}${key}=${inferPlaceholder(key)}`;
        }
        return line;
      });

      return { output: result.join('\n'), count: sanitizedCount };
    }

    const inputEnv = document.getElementById('inputEnv');
    const outputEnv = document.getElementById('outputEnv');
    const statsBadge = document.getElementById('statsBadge');

    function update() {
      const { output, count } = sanitize(inputEnv.value);
      outputEnv.value = output;
      statsBadge.textContent = `${count} key${count === 1 ? '' : 's'} sanitized`;
    }

    inputEnv.addEventListener('input', update);

    // File Drag & Drop + Upload
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          inputEnv.value = evt.target.result;
          update();
        };
        reader.readAsText(file);
      }
    });

    // Sample & Clear
    document.getElementById('loadSampleBtn').addEventListener('click', () => {
      inputEnv.value = SAMPLE_ENV;
      update();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      inputEnv.value = '';
      outputEnv.value = '';
      statsBadge.textContent = '0 keys sanitized';
    });

    // Copy
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    copyBtn.addEventListener('click', async () => {
      if (!outputEnv.value) return;
      await navigator.clipboard.writeText(outputEnv.value);
      copyBtnText.textContent = 'Copied!';
      setTimeout(() => { copyBtnText.textContent = 'Copy'; }, 2000);
    });

    // Download .env.example
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!outputEnv.value) return;
      const blob = new Blob([outputEnv.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '.env.example';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initialize with sample
    inputEnv.value = SAMPLE_ENV;
    update();
  </script>
</body>
</html>
